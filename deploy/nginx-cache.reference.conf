# =============================================================================
# REFERENCE ONLY — Layer 1 of the caching plan (SEO_CACHE_CONTROL_INVESTIGATION_07.md)
#
# NOT wired into any deployment. The production reverse-proxy / CDN config is
# not in this repository. Apply this (adapted to the real infra) together with
# the next.config.js `headers()` snippet at the bottom of this file.
#
# CRITICAL: the cache key MUST include $host. The tenant identity lives ONLY in
# the request Host (never in the path, query, or a cookie). Without $host in the
# key, a cached dusol page is served to cu/ignou visitors — cross-tenant
# content + canonical poisoning. Verify this before enabling ANY shared cache.
# =============================================================================

proxy_cache_path /var/cache/nginx/next
    levels=1:2
    keys_zone=next_cache:50m
    max_size=2g
    inactive=10m
    use_temp_path=off;

map $http_cookie $bypass_cache {
    default        0;
    "~*(session|XSRF-TOKEN|laravel_session|university-cms-session)"  1;   # never cache a request that carries auth/session
}

# Only ever micro-cache the public HTML GET routes of the Next app.
map $request_uri $is_cacheable_path {
    default                 0;
    "~^/$"                  1;
    "~^/courses(/|$)"       1;
    "~^/specialization(/|$)" 1;
    "~^/blog(s)?(/|\?|$)"   1;
    "~^/student-zone(/|$)"  1;
    "~^/(disclaimer|privacy-policy|terms-and-conditions|eligibility|news)$" 1;
}

upstream nextjs_app { server 127.0.0.1:3000; keepalive 32; }
upstream laravel_api { server 127.0.0.1:9000; keepalive 16; }  # adjust to real origin

server {
    listen 443 ssl http2;
    server_name  *.distanceeducationlearning.com;
    # ssl_certificate ... ;  # must cover every tenant subdomain (see SEO-025 re: www)

    # ---------------------------------------------------------------------------
    # Never cache: API, admin, Laravel crawler assets handled separately below.
    # ---------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://laravel_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "private, no-store" always;
    }

    location ~ ^/(admin|filament)(/|$) {
        proxy_pass http://laravel_api;
        proxy_set_header Host $host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ---------------------------------------------------------------------------
    # Laravel crawler assets — cacheable (session/CSRF stripped in routes/web.php,
    # response sets `Cache-Control: public, max-age=3600`). $host in the key.
    # ---------------------------------------------------------------------------
    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        proxy_pass http://laravel_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache next_cache;
        proxy_cache_key "$scheme://$host$request_uri";     # <-- $host is mandatory
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Set-Cookie;                    # there should be none now; belt & braces
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ---------------------------------------------------------------------------
    # Next.js immutable static assets — already have long immutable Cache-Control
    # from Next; just proxy, do not re-cache in nginx.
    # ---------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://nextjs_app;
        proxy_set_header Host $host;
    }

    # RSC / data requests — do NOT micro-cache (they vary by router state).
    location /_next/ {
        proxy_pass http://nextjs_app;
        proxy_set_header Host $host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ---------------------------------------------------------------------------
    # Next.js HTML — short Host-keyed micro-cache for anonymous GETs only.
    # Next still renders every request dynamically; this only absorbs load.
    # ---------------------------------------------------------------------------
    location / {
        proxy_pass http://nextjs_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # gate: only GET, only known public paths, only when no session cookie
        set $do_cache 1;
        if ($request_method != GET)      { set $do_cache 0; }
        if ($is_cacheable_path = 0)       { set $do_cache 0; }
        if ($bypass_cache = 1)           { set $do_cache 0; }

        proxy_cache next_cache;
        proxy_cache_key "$scheme://$host$request_uri";     # <-- $host is mandatory
        proxy_no_cache      $do_cache_inverted;             # see note below
        proxy_cache_bypass  $do_cache_inverted;
        proxy_cache_valid   200 30s;
        proxy_cache_lock    on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;  # Next sends no-store; we override with our own TTL
        proxy_hide_header   Cache-Control;
        add_header Cache-Control "public, max-age=0, s-maxage=30, stale-while-revalidate=60" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    # NOTE: nginx `if` can't negate cleanly; in practice use
    #   map $do_cache $do_cache_inverted { 1 0; default 1; }
    # or restructure with separate `location` blocks per path prefix.
}

